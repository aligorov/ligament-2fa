openapi: 3.0.3
info:
  title: twofa API
  version: 0.2.0
  description: |
    Сервер двухфакторной аутентификации twofa: коды доставки (email / SMS /
    Telegram / Telegram-push), TOTP-приложения, резервные коды и WebAuthn
    (passkeys). Четыре группы REST-эндпоинтов: публичный API входа (без
    состояния, для интеграций), web-сессии (cookie + CSRF), кабинет
    пользователя и админ API (Bearer admin_token).

    Поддерживаемые факторы: TOTP (RFC 6238), коды доставки по каналам
    email/sms/telegram (и approval push в Telegram), одноразовые резервные
    коды, WebAuthn/passkeys.

    Аутентификация: публичные /api/v1/auth/* — без авторизации; /api/v1/me/*
    и /api/v1/logout — cookie twofa_session (+ заголовок X-CSRF-Token на
    мутациях); /api/v1/admin/* — Authorization: Bearer <admin_token>.

    Ошибки — JSON вида {"error":"<машинный_код>"}. Коды ответов значимы:
    401 bad_credentials / bad_code, 409 no_channel / no_credentials /
    username_taken, 423 locked (fail-блокировка), 429 rate_limited /
    cooldown (+ retry_after, заголовок Retry-After), 410 expired.

    RADIUS-интерфейс (Access-Request/Accounting на :1812/:1813, для
    MikroTik/RouterOS) в REST не документируется — см. README.

    Спецификация и человекочитаемая страница: GET /openapi.yaml и /api/docs.
servers:
  - url: http://localhost:8080
    description: Локальный сервер (пример)
tags:
  - name: Public Auth
    description: Публичный API входа /api/v1/auth/* — двухшаговый флоу start/verify, комбинированный вход, poll push-челленджей, WebAuthn-церемония. Без авторизации; rate-limit по username и IP.
  - name: Web Session
    description: Вход web-клиента /api/v1/login, /api/v1/login/2fa, /api/v1/logout — cookie twofa_session, CSRF-заголовок на мутациях, доверенные устройства (cookie twofa_device).
  - name: Me
    description: Кабинет пользователя /api/v1/me/* — профиль, контакты, prefer-каналы, пароль, TOTP, резервные коды, passkeys, Telegram, устройства. Cookie-сессия + CSRF.
  - name: Admin
    description: "Админ API /api/v1/admin/* — пользователи, сбросы факторов, аудит, челленджи, настройки. Authorization: Bearer admin_token."
  - name: OIDC
    description: "OpenID Connect Provider — вход внешних приложений через Ligament: discovery, JWKS, authorization code flow с PKCE, userinfo. Без авторизации (защита — web-сессия пользователя и учётные данные клиента)."
  - name: Service
    description: Служебные эндпоинты (health-проверка).
security: {}

paths:
  /healthz:
    get:
      tags: [Service]
      summary: "Живость процесса и доступность PostgreSQL"
      description: "SELECT 1 через пул соединений: БД недоступна → 503 db_error (балансировщик снимает экземпляр с ротации)."
      operationId: healthz
      responses:
        '200':
          description: Процесс жив, БД отвечает.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [ok]
              example: {status: ok}
        '503':
          description: БД недоступна.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [db_error]
              example: {status: db_error}

  # ---- Public Auth ----

  /api/v1/auth/start:
    post:
      tags: [Public Auth]
      summary: "Шаг 1 входа: проверка пароля и выдача челленджа"
      description: "Проверяет первый фактор и создаёт челлендж по предпочтительному каналу пользователя (prefer_channels). Неверный пароль и несуществующий пользователь неотличимы (401 bad_credentials, анти-перечисление). Fail-блокировка → 423. Rate-limit по username и IP; повторная отправка раньше cooldown → 429."
      operationId: authStart
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartRequest'
            example: {username: user1, password: hunter2}
      responses:
        '200':
          description: Челлендж выдан, код доставляется по каналу.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChallengeIssued'
              example: {challenge_id: 5f0c1b2e-3a4d-4c5b-9e6f-7a8b9c0d1e2f, channel: email, expires_in: 300}
        '400':
          description: Некорректное тело запроса (bad_request).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {error: bad_request}
        '401':
          description: Неверное имя пользователя или пароль.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {error: bad_credentials}
        '409':
          description: Нет доступного канала доставки (no_channel).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {error: no_channel}
        '423':
          description: Fail-блокировка после серии неудачных входов.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {error: locked}
        '429':
          description: Rate-limit исчерпан или действует resend-cooldown.
          headers:
            Retry-After:
              description: Секунды до повторной попытки.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitError'
              example: {error: cooldown, retry_after: 30}
        '500':
          description: Внутренняя ошибка.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {error: internal}

  /api/v1/auth/verify:
    post:
      tags: [Public Auth]
      summary: "Шаг 2 входа: код конкретного челленджа"
      description: "Неверный код → 401 с остатком попыток (attempts_left после атомарного декремента). Закрытый челлендж (использован / просрочен / попытки исчерпаны / удалён janitor'ом) → 410 expired без раскрытия причин."
      operationId: authVerify
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyRequest'
            example: {challenge_id: 5f0c1b2e-3a4d-4c5b-9e6f-7a8b9c0d1e2f, code: "123456"}
      responses:
        '200':
          description: Код верен.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyOK'
              example: {ok: true, username: user1}
        '400':
          description: Некорректное тело или challenge_id не UUID (bad_request).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {error: bad_request}
        '401':
          description: Неверный код; attempts_left — остаток попыток челленджа.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyFail'
              example: {ok: false, attempts_left: 2}
        '410':
          description: Челлендж закрыт (expired).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {error: expired}
        '500':
          description: Внутренняя ошибка.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {error: internal}

  /api/v1/auth/combined:
    post:
      tags: [Public Auth]
      summary: "Комбинированный вход «пароль + код» одним вызовом"
      description: "Код любой: доставленный (start), TOTP или резервный. Пишет login_ok/login_fail в аудит; неудачный код кормит единый fail-счётчик."
      operationId: authCombined
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CombinedRequest'
            example: {username: user1, password: hunter2, code: "123456"}
      responses:
        '200':
          description: Оба фактора верны.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyOK'
              example: {ok: true, username: user1}
        '400':
          description: Некорректное тело запроса (bad_request).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {error: bad_request}
        '401':
          description: Неверный пароль или код.
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean
                    enum: [false]
              example: {ok: false}
        '423':
          description: Fail-блокировка.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {error: locked}
        '500':
          description: Внутренняя ошибка.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {error: internal}

  /api/v1/auth/poll:
    post:
      tags: [Public Auth]
      summary: "Статус push-челленджа (опрос)"
      description: "Клиент опрашивает, пока пользователь решает в Telegram («Подтвердить»/«Это не я»). Неизвестный/удалённый челлендж — терминальный expired (200), а не 404: poll-циклу нужен статус."
      operationId: authPoll
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PollRequest'
            example: {challenge_id: 5f0c1b2e-3a4d-4c5b-9e6f-7a8b9c0d1e2f}
      responses:
        '200':
          description: Текущий статус челленджа.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PollStatus'
              example: {status: pending}
        '400':
          description: Некорректное тело или challenge_id не UUID (bad_request).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {error: bad_request}

  /api/v1/auth/webauthn/begin:
    post:
      tags: [Public Auth]
      summary: "Вход WebAuthn, шаг 1: пароль + параметры церемонии"
      description: "Проверяет пароль (+ fail-блокировку) и возвращает PublicKeyCredentialRequestOptions с одноразовым handle сессии церемонии. Нет зарегистрированных ключей → 409 no_credentials. WebAuthn не сконфигурирован (webauthn.rp_id) → 503."
      operationId: authWebauthnBegin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartRequest'
            example: {username: user1, password: hunter2}
      responses:
        '200':
          description: Параметры церемонии; handle передаётся на finish.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebauthnBegin'
        '400':
          description: Некорректное тело запроса (bad_request).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {error: bad_request}
        '401':
          description: Неверное имя пользователя или пароль.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {error: bad_credentials}
        '409':
          description: У пользователя нет зарегистрированных passkeys (no_credentials).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {error: no_credentials}
        '423':
          description: Fail-блокировка.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {error: locked}
        '500':
          description: Внутренняя ошибка.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {error: internal}
        '503':
          description: WebAuthn не сконфигурирован на сервере.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {error: webauthn_disabled}

  /api/v1/auth/webauthn/finish:
    post:
      tags: [Public Auth]
      summary: "Вход WebAuthn, шаг 2: проверка подписи ключом"
      description: "Тело — сырой PublicKeyCredential (JSON, парсится библиотекой go-webauthn). Handle сессии церемонии — query-параметр ?handle=... или поле \"handle\" того же JSON. Неизвестная/истёкшая/погашенная сессия и неверная подпись — единый 401 bad_credentials. Успех создаёт одноразовое 5-минутное окно webauthn_web_pending: web-логин login/2fa с пустым кодом гасит его ровно один раз."
      operationId: authWebauthnFinish
      parameters:
        - name: handle
          in: query
          required: false
          description: "Одноразовый handle сессии церемонии из begin (альтернатива — поле handle в теле)."
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: "PublicKeyCredential (id/rawId/type/response); опционально поле handle."
              additionalProperties: true
            example: {id: "Kw-3aM...", rawId: "Kw-3aM...", type: public-key, response: {clientDataJSON: "...", authenticatorData: "...", signature: "...", userHandle: "..."}}
      responses:
        '200':
          description: Подпись верна (тело — пустой объект).
          content:
            application/json:
              schema:
                type: object
              example: {}
        '400':
          description: Некорректное тело или отсутствует handle (bad_request / handle_required).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {error: handle_required}
        '401':
          description: Сессия церемонии неизвестна/истекла или подпись неверна.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {error: bad_credentials}
        '500':
          description: Внутренняя ошибка.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {error: internal}
        '503':
          description: WebAuthn не сконфигурирован на сервере.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {error: webauthn_disabled}

  # ---- Web Session ----

  /api/v1/login:
    post:
      tags: [Web Session]
      summary: "Шаг 1 web-входа: пароль (сессия или требование 2FA)"
      description: "Доверенное устройство (cookie twofa_device) с верным паролем и пользователь без второго фактора получают сессию сразу: 200 {ok, username, csrf} + Set-Cookie twofa_session (HttpOnly, Secure, SameSite=Lax). Иначе — 200 {two_factor:\"required\", methods:[...]} без создания сессии; код вводится через /api/v1/login/2fa. Rate-limit по username и IP."
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example: {username: user1, password: hunter2, remember_device: false}
      responses:
        '200':
          description: "Либо вход выполнен (сессия создана, csrf для заголовка X-CSRF-Token), либо требуется второй фактор."
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/LoginOK'
                  - $ref: '#/components/schemas/LoginTwoFactor'
              examples:
                ok:
                  value: {ok: true, username: user1, csrf: 6bd0a8c1e2f34d5a...}
                two_factor:
                  value: {two_factor: required, methods: [totp, webauthn, email]}
        '400':
          description: Некорректное тело запроса (bad_request).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {error: bad_request}
        '401':
          description: Неверное имя пользователя или пароль.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {error: bad_credentials}
        '423':
          description: Fail-блокировка.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {error: locked}
        '429':
          description: Rate-limit исчерпан.
          headers:
            Retry-After:
              description: Секунды до повторной попытки.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitError'
              example: {error: rate_limited, retry_after: 5}
        '500':
          description: Внутренняя ошибка.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {error: internal}

  /api/v1/login/2fa:
    post:
      tags: [Web Session]
      summary: "Шаг 2 web-входа: «пароль + код» одним запросом"
      description: "Код — доставленный (start/send-code), TOTP или резервный. Пустой код допустим сразу после успешной WebAuthn-церемонии входа (окно webauthn_web_pending создаётся /api/v1/auth/webauthn/finish). При remember_device дополнительно выпускается cookie twofa_device."
      operationId: login2fa
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login2FARequest'
            example: {username: user1, password: hunter2, code: "123456", remember_device: true}
      responses:
        '200':
          description: Сессия создана; csrf — для заголовка X-CSRF-Token мутаций.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginOK'
              example: {ok: true, username: user1, csrf: 6bd0a8c1e2f34d5a...}
        '400':
          description: Некорректное тело запроса (bad_request).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {error: bad_request}
        '401':
          description: "Неверные учётные данные (bad_credentials) либо неверный/отсутствующий код (bad_code)."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {error: bad_code}
        '423':
          description: Fail-блокировка.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {error: locked}
        '429':
          description: Rate-limit исчерпан.
          headers:
            Retry-After:
              description: Секунды до повторной попытки.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitError'
              example: {error: rate_limited, retry_after: 5}
        '500':
          description: Внутренняя ошибка.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {error: internal}

  /api/v1/logout:
    post:
      tags: [Web Session]
      summary: "Выход: удалить текущую сессию"
      description: "Удаляет сессию по cookie twofa_session и чистит cookie. Мутация — требует заголовок X-CSRF-Token со значением csrf из ответа login."
      operationId: logout
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Сессия удалена, cookie очищена.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
              example: {ok: true}
        '401':
          description: Нет/просрочена сессия.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {error: unauthorized}
        '403':
          description: Отсутствует или неверен заголовок X-CSRF-Token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {error: csrf}

  # ---- Me ----

  /api/v1/me:
    get:
      tags: [Me]
      summary: "Профиль и статус каналов второго фактора"
      description: "csrf отдаётся в теле (cookie HttpOnly — скрипт токен не прочитает); поле radius_reply_set — признак заданных RADIUS-атрибутов ответа."
      operationId: meProfile
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Профиль пользователя.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
              example: {username: user1, role: user, email: user1@example.com, phone: "+79001234567", email_set: true, phone_set: true, telegram_linked: false, totp_confirmed: true, webauthn_count: 2, prefer_channels: [totp, email], csrf: 6bd0a8c1e2f34d5a..., radius_push: false, radius_reply_set: false}
        '401':
          description: Нет/просрочена сессия.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {error: unauthorized}
        '500':
          description: Внутренняя ошибка.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {error: internal}

  /api/v1/me/password:
    patch:
      tags: [Me]
      summary: "Смена пароля (с отзывом всех сессий и устройств)"
      description: "Проверяет старый пароль, ставит новый (argon2id) и отзывает ВСЕ сессии и доверенные устройства пользователя, включая текущую — клиент обязан перелогиниться. Мутация: X-CSRF-Token."
      operationId: mePasswordChange
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
            example: {old: hunter2, new: "N3w-P@ssw0rd!"}
      responses:
        '200':
          description: Пароль изменён, сессии отозваны.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
              example: {ok: true}
        '400':
