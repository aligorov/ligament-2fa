      description: "Проверяет код по расшифрованному секрету, подтверждает фактор и выдаёт НОВУЮ партию резервных кодов (старые аннулируются; коды показываются ровно один раз). Подтверждённый код «сжигается» — replay невозможен. Мутация: X-CSRF-Token."
