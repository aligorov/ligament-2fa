  /api/v1/admin/settings:
    get:
      tags: [Admin]
      summary: "Дерево настроек с маскированными секретами"
      description: "Секретные значения — масками {\"set\":bool,\"value\":\"••••\"}. Асимметрия: GET отдаёт дерево по секциям, PUT принимает плоские известные ключи."
      operationId: adminSettingsGet
      security:
        - adminBearer: []
      responses:
        '200':
          description: Маскированное дерево настроек.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettingsMasked'
        '401':
          description: Отсутствует или неверен Bearer admin_token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {error: unauthorized}
        '500':
          description: Внутренняя ошибка.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {error: internal}
    put:
      tags: [Admin]
      summary: "Мерж настроек по плоским ключам"
      description: "Тело — объект {ключ: значение}; ключи — только известные (listen.*, radius.*, smtp, sms.gateway, telegram, totp, webauthn, policy, web.session_ttl, admin_token). Объекты сливаются с текущим значением рекурсивно; маска \"••••\" (или {\"value\":\"••••\"}) и пустая строка на любом уровне = «не менять поле». Атомарно: неизвестный ключ отклоняет запрос целиком (400 unknown_key). Ответ — как GET (маскированное дерево)."
      operationId: adminSettingsPut
      security:
        - adminBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: "Карта «известный ключ → значение» (объект мержится, скаляр заменяется)."
              additionalProperties: true
            example: {smtp: {host: smtp.example.com, port: 587}, policy: {code_ttl: 5m}}
      responses:
        '200':
          description: Настройки применены; возвращено маскированное дерево.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettingsMasked'
        '400':
          description: "Неизвестный ключ (unknown_key, с полем key) либо невалидное значение (bad_key)."
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Error'
                  - type: object
                    required: [error, key]
                    properties:
                      error:
                        type: string
                        enum: [unknown_key]
                      key:
                        type: string
              example: {error: unknown_key, key: smtp.hostname}
        '401':
          description: Отсутствует или неверен Bearer admin_token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {error: unauthorized}
        '500':
          description: Внутренняя ошибка.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {error: internal}

  /api/v1/admin/settings/regenerate:
    post:
      tags: [Admin]
      summary: "Перегенерация секрета (admin_token / radius.secret)"
      description: "Новое случайное значение возвращается один раз; GET всегда маскирует. Смена radius.secret применяется на лету."
      operationId: adminSettingsRegenerate
      security:
        - adminBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key]
              properties:
                key:
                  type: string
                  enum: [admin_token, radius.secret]
            example: {key: admin_token}
      responses:
        '200':
          description: Новое значение секрета (показ один раз).
          content:
            application/json:
              schema:
                type: object
                required: [key, value]
                properties:
                  key:
                    type: string
                  value:
                    type: string
              example: {key: admin_token, value: 9f8e7d6c5b4a3f2e1d0c9b8a7f6e5d4c...}
        '400':
          description: Ключ не допускает регенерации (bad_key).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {error: bad_key}
        '401':
          description: Отсутствует или неверен Bearer admin_token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {error: unauthorized}
        '500':
          description: Внутренняя ошибка.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {error: internal}

components:
  securitySchemes:
    adminBearer:
      type: http
      scheme: bearer
      description: "Админ-токен из настроек (admin_token; задать/перегенерировать — POST /api/v1/admin/settings/regenerate). Заголовок Authorization: Bearer <token>; сравнение SHA-256 в постоянном времени."
    sessionCookie:
      type: apiKey
      in: cookie
      name: twofa_session
      description: "Web-сессия (cookie twofa_session, HttpOnly+Secure+SameSite=Lax; выдаётся POST /api/v1/login и /api/v1/login/2fa). Для МУТИРУЮЩИХ методов (POST/PUT/PATCH/DELETE) обязателен заголовок X-CSRF-Token со значением csrf из ответа входа — иначе 403 csrf. Доверенные устройства — отдельная cookie twofa_device (remember_device)."
  schemas:
    Error:
      type: object
      required: [error]
      description: "Машинный код ошибки без внутренних деталей."
      properties:
        error:
          type: string
      example: {error: bad_credentials}
    RateLimitError:
      type: object
      required: [error, retry_after]
      properties:
        error:
          type: string
          enum: [rate_limited, cooldown]
        retry_after:
          type: integer
          description: Секунды до повторной попытки (дублируется заголовком Retry-After).
      example: {error: cooldown, retry_after: 30}
    Ok:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
          enum: [true]
      example: {ok: true}
    StartRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
          format: password
    VerifyRequest:
      type: object
      required: [challenge_id, code]
      properties:
        challenge_id:
          type: string
          format: uuid
        code:
          type: string
    CombinedRequest:
      type: object
      required: [username, password, code]
      properties:
        username:
          type: string
        password:
          type: string
          format: password
        code:
          type: string
          description: "Доставленный, TOTP или резервный код."
    PollRequest:
      type: object
      required: [challenge_id]
      properties:
        challenge_id:
          type: string
          format: uuid
    ChallengeIssued:
      type: object
      required: [challenge_id, channel, expires_in]
      properties:
        challenge_id:
          type: string
          format: uuid
        channel:
          type: string
          enum: [email, sms, telegram, telegram_push, totp]
          description: "Канал выдачи кода; totp — челлендж без доставки (код генерируется приложением пользователя)."
        expires_in:
          type: integer
          description: Секунды до истечения челленджа.
    VerifyOK:
      type: object
      required: [ok, username]
      properties:
        ok:
          type: boolean
          enum: [true]
        username:
          type: string
    VerifyFail:
      type: object
      required: [ok, attempts_left]
      properties:
        ok:
          type: boolean
          enum: [false]
        attempts_left:
          type: integer
          description: Остаток попыток челленджа после неверного кода.
    PollStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [pending, approved, denied, expired]
          description: "approved/denied — решение push-кнопок Telegram; expired — просрочен, попытки исчерпаны или код погашен."
    WebauthnBegin:
      type: object
      required: [handle, options]
      properties:
        handle:
          type: string
          description: Одноразовый идентификатор сессии церемонии.
        options:
          type: object
          additionalProperties: true
          description: "PublicKeyCredentialRequestOptions (вход) или PublicKeyCredentialCreationOptions (регистрация) — формат WebAuthn Level 2."
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
          format: password
        remember_device:
          type: boolean
          description: Доверять устройству (cookie twofa_device на срок policy.trusted_device_ttl).
          default: false
    Login2FARequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
          format: password
        code:
          type: string
          description: "Код доставки/TOTP/резервный; пустой — только сразу после успешной WebAuthn-церемонии (webauthn_web_pending)."
        remember_device:
          type: boolean
          default: false
    LoginOK:
      type: object
      required: [ok, username, csrf]
      properties:
        ok:
          type: boolean
          enum: [true]
        username:
          type: string
        csrf:
          type: string
          description: "CSRF-токен сессии — для заголовка X-CSRF-Token мутаций (cookie HttpOnly, скрипт прочитать не может)."
    LoginTwoFactor:
      type: object
      required: [two_factor, methods]
      properties:
        two_factor:
          type: string
          enum: [required]
        methods:
          type: array
          items:
            type: string
            enum: [totp, webauthn, email, sms, telegram]
          description: Доступные пользователю способы второго фактора.
    Profile:
      type: object
      required: [username, role, email, phone, email_set, phone_set, telegram_linked, totp_confirmed, webauthn_count, prefer_channels, csrf, radius_push, radius_reply_set]
      properties:
        username:
          type: string
        role:
          type: string
        email:
          type: string
        phone:
          type: string
        email_set:
          type: boolean
        phone_set:
          type: boolean
        telegram_linked:
          type: boolean
        totp_confirmed:
          type: boolean
        webauthn_count:
          type: integer
        prefer_channels:
          type: array
          items:
            type: string
        csrf:
          type: string
        radius_push:
          type: boolean
        radius_reply_set:
          type: boolean
    PasswordChangeRequest:
      type: object
      required: [old, new]
      properties:
        old:
          type: string
          format: password
        new:
          type: string
          format: password
    ContactsRequest:
      type: object
      required: [code]
      properties:
        email:
          type: string
          nullable: true
          description: nil — не менять; пустая строка — очистить.
        phone:
          type: string
          nullable: true
        code:
          type: string
    PreferRequest:
      type: object
      required: [channels]
      properties:
        channels:
          type: array
          minItems: 1
          items:
            type: string
            enum: [totp, email, sms, telegram, telegram_push]
    CodeRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string
    WebauthnRegisterBeginRequest:
      type: object
      required: [name, code]
      properties:
        name:
          type: string
          description: Метка ключа.
        code:
          type: string
    WebauthnCredential:
      type: object
      required: [id, name, attachment, transports, aaguid, backup_eligible, backup_state, clone_warning, last_used_at]
      properties:
        id:
          type: integer
        name:
          type: string
        attachment:
          type: string
        transports:
          type: array
          items:
            type: string
        aaguid:
          type: string
        backup_eligible:
          type: boolean
        backup_state:
          type: boolean
        clone_warning:
          type: boolean
        last_used_at:
          type: string
          nullable: true
          format: date-time
    Device:
      type: object
      required: [id, ua, ip, created_at, last_seen_at, expires_at]
      properties:
        id:
          type: integer
        ua:
          type: string
          description: User-Agent устройства.
        ip:
          type: string
        created_at:
          type: string
          format: date-time
        last_seen_at:
          type: string
          format: date-time
          nullable: true
        expires_at:
          type: string
          format: date-time
    User:
      type: object
      description: Пользователь в ответах admin API (password_hash никогда не раскрывается).
      required: [id, username, role, enabled, email, phone, telegram_linked, prefer_channels, radius_push]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        role:
          type: string
          description: "user или admin."
        enabled:
          type: boolean
        email:
          type: string
        phone:
          type: string
        telegram_linked:
          type: boolean
        prefer_channels:
          type: array
          items:
            type: string
        radius_push:
          type: boolean
        radius_reply:
          type: object
          additionalProperties:
            type: string
          nullable: true
          description: RADIUS-атрибуты ответа для пользователя.
    UserCreateRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
          format: password
        email:
          type: string
        phone:
          type: string
        role:
          type: string
          default: user
        prefer_channels:
          type: array
          items:
            type: string
            enum: [totp, email, sms, telegram, telegram_push]
    UserPatchRequest:
      type: object
      description: Отсутствующие (nil) поля не меняются.
      properties:
        username:
          type: string
          nullable: true
        password:
          type: string
          nullable: true
          format: password
        email:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        role:
          type: string
          nullable: true
        enabled:
          type: boolean
          nullable: true
        prefer_channels:
          type: array
          nullable: true
          items:
            type: string
            enum: [totp, email, sms, telegram, telegram_push]
        radius_push:
          type: boolean
          nullable: true
        radius_reply:
          type: object
          additionalProperties:
            type: string
    AuditRow:
      type: object
      description: Запись audit_log.
      required: [id, ts, username, event, detail, src_ip, result]
      properties:
        id:
          type: integer
          format: int64
        ts:
          type: string
          format: date-time
        username:
          type: string
          description: Пустая строка — системное событие.
        event:
          type: string
        detail:
          type: object
          additionalProperties: true
          nullable: true
          description: JSONB-детали события.
        src_ip:
          type: string
        result:
          type: string
          enum: [ok, fail]
    Challenge:
      type: object
      description: Метаданные активного челленджа (code_hash не раскрывается).
      required: [id, user_id, channel, purpose, push_state, attempts_left, expires_at, created_at]
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        channel:
          type: string
          enum: [email, sms, telegram, telegram_push, totp, webauthn]
        purpose:
          type: string
          enum: [api, radius, radius_prefetch, ui_confirm, webauthn_session, webauthn_web_pending, tg_link]
        push_state:
          type: string
          enum: ["", pending, approved, denied]
          description: Только для telegram_push; пустая строка для прочих каналов.
        attempts_left:
          type: integer
        expires_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
    SettingsMasked:
      type: object
      description: "Дерево настроек по секциям; секретные значения маскируются форматом {\"set\":bool,\"value\":\"••••\"}. PUT принимает плоские известные ключи, маска/пустая строка = «не менять»."
      additionalProperties: true
      example: {listen: {http: "0.0.0.0:8080", radius_auth: "0.0.0.0:1812", radius_acct: "0.0.0.0:1813"}, admin_token: {set: true, value: "••••"}, radius: {secret: {set: true, value: "••••"}, max_fail_per_user: 5, push_wait: 20s}, smtp: {host: smtp.example.com, port: 587, password: {set: true, value: "••••"}, starttls: true}, telegram: {bot_token: {set: true, value: "••••"}}, totp: {issuer: twofa, digits: 6, period: 30, skew: 1}, webauthn: {rp_id: 2fa.example.com}, policy: {code_ttl: 5m, code_length: 6, max_attempts: 3, resend_cooldown: 30s, session_ttl: 12h}}
