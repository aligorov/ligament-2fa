  /api/v1/admin/audit:
    get:
      tags: [Admin]
      summary: "Журнал аудита с фильтрами"
      description: "Новые записи первыми; limit 1..1000 (по умолчанию 100)."
      operationId: adminAudit
      security:
        - adminBearer: []
      parameters:
        - name: username
          in: query
          required: false
          schema:
            type: string
          example: user1
        - name: event
          in: query
          required: false
          description: "Например login_fail, api_start, admin_action."
          schema:
            type: string
          example: login_fail
        - name: since
          in: query
          required: false
          description: Нижняя граница (RFC3339).
          schema:
            type: string
            format: date-time
          example: "2026-09-01T00:00:00Z"
        - name: until
          in: query
          required: false
          description: Верхняя граница (RFC3339).
          schema:
            type: string
            format: date-time
          example: "2026-09-05T00:00:00Z"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 1000
          example: 100
      responses:
        '200':
          description: Записи аудита.
          content:
            application/json:
              schema:
                type: object
                required: [events]
                properties:
                  events:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuditRow'
              example: {events: [{id: 142, ts: "2026-09-05T10:11:12Z", username: user1, event: login_ok, detail: {mode: password+code}, src_ip: 192.168.1.10, result: ok}]}
        '400':
          description: "Некорректные since/until (не RFC3339) или limit вне 1..1000 (bad_request)."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {error: bad_request}
        '401':
          description: Отсутствует или неверен Bearer admin_token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {error: unauthorized}
        '500':
