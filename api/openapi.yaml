  /api/v1/admin/settings:
    get:
      tags: [Admin]
      summary: "Дерево настроек с маскированными секретами"
      description: "Секретные значения — масками {\"set\":bool,\"value\":\"••••\"}. Асимметрия: GET отдаёт дерево по секциям, PUT принимает плоские известные ключи."
      operationId: adminSettingsGet
      security:
        - adminBearer: []
      responses:
        '200':
          description: Маскированное дерево настроек.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettingsMasked'
        '401':
          description: Отсутствует или неверен Bearer admin_token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {error: unauthorized}
        '500':
          description: Внутренняя ошибка.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {error: internal}
    put:
      tags: [Admin]
      summary: "Мерж настроек по плоским ключам"
      description: "Тело — объект {ключ: значение}; ключи — только известные (listen.*, radius.*, smtp, sms.gateway, telegram, totp, webauthn, policy, web.session_ttl, admin_token). Объекты сливаются с текущим значением рекурсивно; маска \"••••\" (или {\"value\":\"••••\"}) и пустая строка на любом уровне = «не менять поле». Атомарно: неизвестный ключ отклоняет запрос целиком (400 unknown_key). Ответ — как GET (маскированное дерево)."
      operationId: adminSettingsPut
      security:
        - adminBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: "Карта «известный ключ → значение» (объект мержится, скаляр заменяется)."
              additionalProperties: true
            example: {smtp: {host: smtp.example.com, port: 587}, policy: {code_ttl: 5m}}
      responses:
        '200':
          description: Настройки применены; возвращено маскированное дерево.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettingsMasked'
        '400':
          description: "Неизвестный ключ (unknown_key, с полем key) либо невалидное значение (bad_key)."
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Error'
                  - type: object
                    required: [error, key]
                    properties:
                      error:
                        type: string
                        enum: [unknown_key]
                      key:
                        type: string
              example: {error: unknown_key, key: smtp.hostname}
        '401':
          description: Отсутствует или неверен Bearer admin_token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {error: unauthorized}
        '500':
          description: Внутренняя ошибка.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {error: internal}

  /api/v1/admin/settings/regenerate:
    post:
      tags: [Admin]
      summary: "Перегенерация секрета (admin_token / radius.secret)"
      description: "Новое случайное значение возвращается один раз; GET всегда маскирует. Смена radius.secret применяется на лету."
      operationId: adminSettingsRegenerate
      security:
        - adminBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key]
              properties:
                key:
                  type: string
                  enum: [admin_token, radius.secret]
            example: {key: admin_token}
      responses:
        '200':
          description: Новое значение секрета (показ один раз).
          content:
            application/json:
              schema:
                type: object
                required: [key, value]
                properties:
                  key:
                    type: string
                  value:
                    type: string
              example: {key: admin_token, value: 9f8e7d6c5b4a3f2e1d0c9b8a7f6e5d4c...}
        '400':
          description: Ключ не допускает регенерации (bad_key).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {error: bad_key}
        '401':
          description: Отсутствует или неверен Bearer admin_token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {error: unauthorized}
        '500':
          description: Внутренняя ошибка.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {error: internal}

  /api/v1/admin/settings/export:
    get:
      tags: [Admin]
      summary: "Экспорт настроек (файл с секретами)"
      description: "Вложение ligament-settings-YYYYMMDD.json: ВСЕ настройки {ключ: значение}, кроме master_key и admin_token (не экспортируются никогда). Файл содержит секреты (radius.secret, smtp.password, токен Telegram, креды SMS/LDAP) и помечен полем _warning — храните его как секрет. Действие пишется в аудит (settings_export)."
      operationId: adminSettingsExport
      security:
        - adminBearer: []
      responses:
        '200':
          description: "JSON-файл экспорта (Content-Disposition: attachment)."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettingsExport'
        '401':
          description: Отсутствует или неверен Bearer admin_token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {error: unauthorized}
        '500':
          description: Внутренняя ошибка.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {error: internal}

  /api/v1/admin/settings/import:
    put:
      tags: [Admin]
      summary: "Импорт настроек (файл экспорта)"
      description: "Применяет {settings:{ключ: значение}} заменой значения ключа. Атомарно: СНАЧАЛА валидируются все ключи — неизвестный отклоняет запрос целиком (400 unknown_key со списком keys), ничего не применяется. Затем ключи применяются по одному через settings-менеджер и следует один Reload. Пропускаются (skipped): null и маски («••••» / {\"value\":\"••••\"}), master_key/admin_token, ключи license.* (runtime-состояние инсталляции). Отсутствующие в файле ключи не затрагиваются. Ответ {applied, skipped}; аудит settings_import."
      operationId: adminSettingsImport
      security:
        - adminBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SettingsImportRequest'
            example: {settings: {totp: {issuer: corp-2fa, digits: 6, period: 30, skew: 1}, "listen.http": ":8080"}}
      responses:
        '200':
          description: Настройки применены.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettingsImportResult'
        '400':
          description: "Неизвестный ключ (unknown_key со списком keys) либо невалидное значение (bad_key)."
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Error'
                  - type: object
                    required: [error, keys]
                    properties:
                      error:
                        type: string
                        enum: [unknown_key]
                      keys:
                        type: array
                        items:
                          type: string
              example: {error: unknown_key, keys: [smtp.hostname]}
        '401':
          description: Отсутствует или неверен Bearer admin_token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {error: unauthorized}
        '500':
          description: Внутренняя ошибка.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {error: internal}

  /api/v1/admin/firewall:
    get:
      tags: [Admin]
      summary: "Файрвол: списки IP и активные блокировки"
      description: "Чёрные/белые списки CIDR (allow/deny) и автобаны fail2ban по IP (web/API/RADIUS фильтруются одинаково: чёрный список → веб 403 / RADIUS Reject; бан → 429 / Reject; белый список не баним). Приоритет: чёрный список → бан → белый список; IP в обоих списках отклоняется (fail-closed). 127.0.0.1 автоматикой не банится. Аудит firewall_view."
      operationId: adminFirewallGet
      security:
        - adminBearer: []
      responses:
        '200':
          description: Списки и банки.
          content:
            application/json:
              schema:
                type: object
                required: [allow, deny, bans, settings]
                properties:
                  allow: {type: array, items: {$ref: '#/components/schemas/IPListRow'}}
                  deny: {type: array, items: {$ref: '#/components/schemas/IPListRow'}}
                  bans: {type: array, items: {$ref: '#/components/schemas/IPBanRow'}}
                  settings:
                    type: object
                    properties:
                      enabled: {type: boolean}
                      max_fail: {type: integer}
                      window: {type: string}
                      ban_time: {type: string}
              example: {allow: [], deny: [{id: 019a…, kind: deny, cidr: "203.0.113.0/24", note: сканер}], bans: [{ip: 203.0.113.7, reason: login_fail, fails: 10, banned_until: "2026-09-06T15:00:00Z"}], settings: {enabled: true, max_fail: 10, window: 5m0s, ban_time: 30m0s}}
        '401': {$ref: '#/components/responses/Unauthorized'}

  /api/v1/admin/firewall/ip:
    post:
      tags: [Admin]
      summary: "Добавить CIDR в чёрный/белый список"
      description: "CIDR или одиночный IP (нормализуется: 10.0.0.5 → 10.0.0.5/32). kind=deny — отклонять всегда; kind=allow — не банить автоматикой. Дубликат по (kind,cidr) обновляет заметку. Кэш guard сбрасывается сразу. Аудит firewall_ip_add. Мутация: X-CSRF-Token не нужен (admin_token)."
      operationId: adminFirewallIPAdd
      security:
        - adminBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, cidr]
              properties:
                kind: {type: string, enum: [allow, deny]}
                cidr: {type: string, example: "203.0.113.0/24"}
                note: {type: string}
      responses:
        '201':
          description: Запись создана.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/IPListRow'}
        '400': {$ref: '#/components/responses/BadRequest'}

  /api/v1/admin/firewall/ip/{id}:
    delete:
      tags: [Admin]
      summary: "Удалить запись списка"
      description: "Удаляет CIDR из чёрного/белого списка по id; кэш guard сбрасывается сразу. Аудит firewall_ip_delete."
      operationId: adminFirewallIPDelete
      security:
        - adminBearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Удалено.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Ok'}
        '404': {$ref: '#/components/responses/NotFound'}

  /api/v1/admin/firewall/bans/{ip}:
    delete:
      tags: [Admin]
      summary: "Ручной разбан IP"
      description: "Снимает активную автоблокировку fail2ban (счётчик обнуляется удалением записи). Аудит firewall_unban."
      operationId: adminFirewallUnban
      security:
        - adminBearer: []
      parameters:
        - name: ip
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Бан снят.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Ok'}
        '400': {$ref: '#/components/responses/BadRequest'}

  /api/v1/admin/oidc/clients:
    get:
      tags: [Admin]
      summary: "OIDC: список клиентских приложений"
      description: "Клиенты (relying party) OpenID Connect Provider. Секреты не возвращаются никогда (в БД только хеш). Аудит не пишется (чтение)."
      operationId: adminOIDCClientsList
      security:
        - adminBearer: []
      responses:
        '200':
          description: Список клиентов.
          content:
            application/json:
              schema:
                type: object
                required: [clients]
                properties:
                  clients:
                    type: array
                    items: {$ref: '#/components/schemas/OIDCClient'}
              example: {clients: [{id: 019b…, client_id: mfa_aBcD1234, name: Grafana, redirect_uris: ["https://grafana.example.com/login/generic_oauth"], is_public: false, created_at: "2026-09-05T12:00:00Z"}]}
        '401': {$ref: '#/components/responses/Unauthorized'}
    post:
      tags: [Admin]
      summary: "OIDC: создать клиентское приложение"
      description: "Генерирует client_id (mfa_…) и client_secret (если не переданы явно); секрет возвращается РОВНО ОДИН раз (в БД — только хеш sha256+salt). public-клиент (SPA/мобильные) секрета не получает: только PKCE S256. PUT-патча нет — пересоздайте клиента. Аудит oidc_client_create."
      operationId: adminOIDCClientCreate
      security:
        - adminBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, redirect_uris]
              properties:
                name: {type: string, example: Grafana}
                client_id: {type: string, description: "Опциональный кастомный client_id. Если не задан, генерируется mfa_..."}
                client_secret: {type: string, description: "Опциональный кастомный client_secret. Если не задан, генерируется автоматически."}
                redirect_uris:
                  type: array
                  items: {type: string}
                  description: "Абсолютные http(s)-URL; совпадение при authorize строгое."
                is_public: {type: boolean, description: "public-клиент без секрета (PKCE S256 обязателен)."}
            example: {name: Grafana, redirect_uris: ["https://grafana.example.com/login/generic_oauth"], is_public: false}
      responses:
        '201':
          description: "Клиент создан; client_secret показан единственный раз."
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OIDCClientCreated'}
        '400': {$ref: '#/components/responses/BadRequest'}

  /api/v1/admin/oidc/clients/{id}:
    delete:
      tags: [Admin]
      summary: "OIDC: удалить клиентское приложение"
      description: "Удаляет клиента по id вместе с его authorization-кодами и access-токенами. Аудит oidc_client_delete."
      operationId: adminOIDCClientDelete
      security:
        - adminBearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Удалено.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Ok'}
        '404': {$ref: '#/components/responses/NotFound'}

  /api/v1/admin/backup:
    get:
      tags: [Admin]
      summary: "Логический бэкап БД (SQL-дамп)"
      description: "Вложение ligament-backup-YYYYMMDD.sql — тот же дамп, что даёт `twofa -backup` (BEGIN; DELETE FROM + multi-row INSERT; COMMIT;): пользователи, TOTP-шифротексты, сессии, настройки (без master_key), audit_log. master_key в дамп НЕ входит: восстановление на другую инсталляцию требует того же master_key. Восстановление — psql (см. README «Бэкап и перенос»). При audit_log > 500000 строк — 413 backup_too_large с подсказкой снять дамп CLI. Аудит backup_download пишется после генерации (событие не попадает в дамп)."
      operationId: adminBackupGet
      security:
        - adminBearer: []
      responses:
        '200':
          description: "SQL-дамп вложением (Content-Disposition: attachment)."
          content:
            application/sql:
              schema:
                type: string
        '401':
          description: Отсутствует или неверен Bearer admin_token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {error: unauthorized}
        '413':
          description: audit_log слишком велик для HTTP-бэкапа — используйте CLI.
          content:
            application/json:
              schema:
                type: object
                required: [error, audit_rows, hint]
                properties:
                  error:
                    type: string
                    enum: [backup_too_large]
                  audit_rows:
                    type: integer
                  hint:
                    type: string
              example: {error: backup_too_large, audit_rows: 600000, hint: "снимите дамп CLI: twofa -dsn ... -backup out.sql (-backup-audit=false — без журнала событий)"}
        '500':
          description: Внутренняя ошибка.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {error: internal}

  /api/v1/admin/license:
    get:
      tags: [Admin]
      summary: "Статус лицензии (без блоба)"
      description: "Режим free/trial/licensed, лимит и число активных пользователей, метаданные лицензии (клиент, lic_id, тариф), сроки подписки/демо и окна обновлений. Сам license-блоб не возвращается."
      operationId: adminLicenseGet
      security:
        - adminBearer: []
      responses:
        '200':
          description: Маскированный статус лицензии.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LicenseStatus'
        '401':
          description: Отсутствует или неверен Bearer admin_token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {error: unauthorized}
        '500':
          description: Внутренняя ошибка.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {error: internal}
    put:
      tags: [Admin]
      summary: "Загрузка license-файла"
      description: "Тело {blob}: полное содержимое PEM-подобного файла (-----BEGIN LIGAMENT LICENSE----- ...). Проверка: формат, подпись Ed25519 зашитым ключом (kid), CRL-отзыв. Истёкшая подписка принимается (гаснет в free после grace) — 400 только для битого формата/подписки и отозванной лицензии. Действие пишется в аудит (license_upload)."
      operationId: adminLicensePut
      security:
        - adminBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [blob]
              properties:
                blob:
                  type: string
            example: {blob: "-----BEGIN LIGAMENT LICENSE-----\nZXhhbXBsZQ.c2ln\n-----END LIGAMENT LICENSE-----"}
      responses:
        '200':
          description: Лицензия применена; возвращен статус.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LicenseStatus'
        '400':
          description: "Битый формат (invalid_format), неверная подпись/ключ (invalid_signature), отозвана CRL (revoked) либо пустой blob (bad_request)."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {error: invalid_signature}
        '401':
          description: Отсутствует или неверен Bearer admin_token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {error: unauthorized}
        '500':
          description: Внутренняя ошибка.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {error: internal}
    delete:
      tags: [Admin]
      summary: "Удаление лицензии (free-режим)"
      description: "Снимает загруженную лицензию: сервер возвращается в бесплатный режим (5 активных пользователей). Действие пишется в аудит (license_remove)."
      operationId: adminLicenseDelete
      security:
        - adminBearer: []
      responses:
        '200':
          description: Лицензия удалена; возвращен статус free.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LicenseStatus'
        '401':
          description: Отсутствует или неверен Bearer admin_token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {error: unauthorized}
        '500':
          description: Внутренняя ошибка.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {error: internal}

  /api/v1/admin/license/crl:
    put:
      tags: [Admin]
      summary: "Загрузка CRL-отзыва лицензии"
      description: "Тело {blob}: подписанный вендором revocation-файл (-----BEGIN LIGAMENT REVOCATION-----) — досрочный отзыв подписки. Проверка той же схемой Ed25519; отзыв действует на lic_id из блоба. Действие пишется в аудит (license_crl_upload)."
      operationId: adminLicenseCrlPut
      security:
        - adminBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [blob]
              properties:
                blob:
                  type: string
            example: {blob: "-----BEGIN LIGAMENT REVOCATION-----\nZXhhbXBsZQ.c2ln\n-----END LIGAMENT REVOCATION-----"}
      responses:
        '200':
          description: CRL принят.
          content:
            application/json:
              schema:
                type: object
                required: [lic_id, revoked_at]
                properties:
                  lic_id:
                    type: string
                  revoked_at:
                    type: string
              example: {lic_id: 11111111-2222-3333-4444-555555555555, revoked_at: "2026-09-06T10:00:00Z"}
        '400':
          description: "Битый формат (invalid_format), неверная подпись/ключ (invalid_signature) либо пустой blob (bad_request)."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {error: invalid_signature}
        '401':
          description: Отсутствует или неверен Bearer admin_token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {error: unauthorized}
        '500':
          description: Внутренняя ошибка.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {error: internal}

  # ---- OpenID Connect Provider (публичные, без авторизации) ----

  /.well-known/openid-configuration:
    get:
      tags: [OIDC]
      summary: "Discovery-документ провайдера"
      description: "Метаданные OIDC Provider: issuer (настройка server.domain, иначе схема+Host запроса), эндпоинты authorize/token/userinfo/JWKS, поддерживаемые grant/scope/методы. Точка входа для настройки внешних приложений."
      operationId: oidcDiscovery
      responses:
        '200':
          description: Discovery-документ (OpenID Connect Discovery 1.0).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OIDCDiscovery'}
              example: {issuer: "https://2fa.example.com", authorization_endpoint: "https://2fa.example.com/oidc/authorize", token_endpoint: "https://2fa.example.com/oidc/token", userinfo_endpoint: "https://2fa.example.com/oidc/userinfo", jwks_uri: "https://2fa.example.com/.well-known/jwks.json", response_types_supported: [code], grant_types_supported: [authorization_code], subject_types_supported: [public], id_token_signing_alg_values_supported: [RS256], code_challenge_methods_supported: [plain, S256], scopes_supported: [openid, profile, email], token_endpoint_auth_methods_supported: [client_secret_basic, client_secret_post, none]}

  /.well-known/jwks.json:
    get:
      tags: [OIDC]
      summary: "JWKS: публичные ключи проверки подписи"
      description: "Публичный RSA-ключ (kid, RS256) для проверки подписи ID-токенов клиентскими приложениями."
      operationId: oidcJWKS
      responses:
        '200':
          description: Набор ключей (RFC 7517).
          content:
            application/json:
              schema:
                type: object
                required: [keys]
                properties:
                  keys:
                    type: array
                    items:
                      type: object
                      required: [kty, use, kid, alg, n, e]
                      properties:
                        kty: {type: string, enum: [RSA]}
                        use: {type: string, enum: [sig]}
                        kid: {type: string}
                        alg: {type: string, enum: [RS256]}
                        n: {type: string, description: "Модуль, base64url без паддинга."}
                        e: {type: string, example: AQAB}
              example: {keys: [{kty: RSA, use: sig, kid: 0f1e2d3c4b5a6978, alg: RS256, n: "0oaX…", e: AQAB}]}

  /oidc/authorize:
    get:
      tags: [OIDC]
      summary: "Authorization endpoint (вход через Ligament)"
      description: "Проверяет client_id и redirect_uri (строгое совпадение; ошибки клиента — страница 400 без редиректа), затем параметры запроса (ошибки — редирект с error/state). Без web-сессии — редирект /login?next=<authorize>; с сессией — страница согласия (oidc_consent), подтверждение выпускает код. Параметры: client_id, redirect_uri, response_type=code, scope (обязателен openid), state, nonce, code_challenge+code_challenge_method (S256 обязателен для public-клиентов)."
      operationId: oidcAuthorize
      parameters:
        - name: client_id
          in: query
          required: true
          schema: {type: string}
        - name: redirect_uri
          in: query
          required: true
          schema: {type: string}
        - name: response_type
          in: query
          required: true
          schema: {type: string, enum: [code]}
        - name: scope
          in: query
          required: true
          schema: {type: string, example: "openid profile email"}
        - name: state
          in: query
          schema: {type: string}
        - name: nonce
          in: query
          schema: {type: string}
        - name: code_challenge
          in: query
          schema: {type: string}
        - name: code_challenge_method
          in: query
          schema: {type: string, enum: [S256, plain]}
      responses:
        '200':
          description: Страница согласия (HTML).
        '302':
          description: "redirect_uri?code=…&state=… (после подтверждения), /login?next=… (без сессии) либо redirect_uri?error=… (invalid_scope, unsupported_response_type, invalid_request)."
        '400':
          description: "Страница ошибки (HTML): неизвестный client_id или незарегистрированный redirect_uri — редиректить нельзя."

  /oidc/authorize/confirm:
    post:
      tags: [OIDC]
      summary: "Подтверждение согласия (HTML-форма)"
      description: "POST со страницы согласия: CSRF-токен сессии + скрытые поля всех параметров authorize. Выпускает authorization-код (32 байта, TTL 60 с, одноразовый) и редиректит на redirect_uri?code=…&state=…. Аудит oidc_consent."
      operationId: oidcAuthorizeConfirm
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [csrf_token, client_id, redirect_uri, response_type, scope]
              properties:
                csrf_token: {type: string}
                client_id: {type: string}
                redirect_uri: {type: string}
                response_type: {type: string}
                scope: {type: string}
                state: {type: string}
                nonce: {type: string}
                code_challenge: {type: string}
                code_challenge_method: {type: string}
      responses:
        '302':
          description: "redirect_uri?code=…&state=…; без сессии — /login?next=…; ошибка запроса — redirect_uri?error=…."
        '400':
          description: "Страница ошибки (HTML): неизвестный клиент/redirect_uri."
        '403':
          description: "Отсутствует или неверен CSRF-токен (text/plain)."

  /oidc/token:
    post:
      tags: [OIDC]
      summary: "Token endpoint (grant_type=authorization_code)"
      description: "Аутентификация клиента: Basic или form (public — без секрета, PKCE обязателен). Атомарно погашает код (повторное использование/истёкший → invalid_grant), проверяет PKCE (S256/plain) и выдаёт access-токен (TTL 300 с) и подписанный ID-токен (RS256, TTL 5 мин). Refresh-токенов нет. Аудит oidc_token. Ошибки — RFC 6749 §5.2: {error}."
      operationId: oidcToken
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [grant_type, code, redirect_uri]
              properties:
                grant_type: {type: string, enum: [authorization_code]}
                code: {type: string}
                redirect_uri: {type: string}
                client_id: {type: string}
                client_secret: {type: string, description: "form-аутентификация (альтернатива Basic)."}
                code_verifier: {type: string, description: "PKCE; обязателен, если код выдан с code_challenge."}
            example: {grant_type: authorization_code, code: "…", redirect_uri: "https://grafana.example.com/login/generic_oauth", code_verifier: "dBjftJeZ4CVP…"}
      responses:
        '200':
          description: "Токены; ID-токен содержит iss/sub/aud/exp/iat/auth_time/amr/groups (+nonce, profile/email по scope)."
          content:
            application/json:
              schema:
                type: object
                required: [access_token, token_type, expires_in, scope, id_token]
                properties:
                  access_token: {type: string}
                  token_type: {type: string, enum: [Bearer]}
                  expires_in: {type: integer, example: 300}
                  scope: {type: string}
                  id_token: {type: string, description: "JWT RS256."}
              example: {access_token: "…", token_type: Bearer, expires_in: 300, scope: "openid profile email", id_token: "eyJhbGciOiJSUzI1NiIs…"}
        '400':
          description: "invalid_request / invalid_grant / unsupported_grant_type."
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
              example: {error: invalid_grant}
        '401':
          description: invalid_client (неверный/неизвестный клиент).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
              example: {error: invalid_client}

  /oidc/userinfo:
    get:
      tags: [OIDC]
      summary: "Клеймы пользователя по access-токену"
      description: "Authorization: Bearer <access_token> (из /oidc/token, TTL 300 с). sub обязателен; preferred_username/name/groups — по scope profile, email/email_verified — по scope email."
      operationId: oidcUserinfo
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Клеймы пользователя.
          content:
            application/json:
              schema:
                type: object
                required: [sub]
                properties:
                  sub: {type: string, description: "UUID пользователя."}
                  preferred_username: {type: string}
                  name: {type: string}
                  groups: {type: array, items: {type: string}}
                  email: {type: string}
                  email_verified: {type: boolean}
              example: {sub: "11111111-1111-1111-1111-111111111111", preferred_username: vasya, name: Василий, groups: [user], email: vasya@example.com, email_verified: true}
        '401':
          description: "invalid_token: токен отсутствует, неизвестен или истёк."
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
              example: {error: invalid_token}

components:
  securitySchemes:
    adminBearer:
      type: http
      scheme: bearer
      description: "Админ-токен из настроек (admin_token; задать/перегенерировать — POST /api/v1/admin/settings/regenerate). Заголовок Authorization: Bearer <token>; сравнение SHA-256 в постоянном времени."
    bearerAuth:
      type: http
      scheme: bearer
      description: "Access-токен /oidc/token (TTL 300 с); заголовок Authorization: Bearer <access_token> для /oidc/userinfo."
    sessionCookie:
      type: apiKey
      in: cookie
      name: twofa_session
      description: "Web-сессия (cookie twofa_session, HttpOnly+Secure+SameSite=Lax; выдаётся POST /api/v1/login и /api/v1/login/2fa). Для МУТИРУЮЩИХ методов (POST/PUT/PATCH/DELETE) обязателен заголовок X-CSRF-Token со значением csrf из ответа входа — иначе 403 csrf. Доверенные устройства — отдельная cookie twofa_device (remember_device)."
  schemas:
    IPListRow:
      type: object
      required: [id, kind, cidr]
      properties:
        id: {type: string, format: uuid}
        kind: {type: string, enum: [allow, deny]}
        cidr: {type: string, example: "203.0.113.0/24"}
        note: {type: string}
        created_at: {type: string, format: date-time}
    IPBanRow:
      type: object
      required: [ip, reason, fails, banned_until]
      properties:
        ip: {type: string}
        reason: {type: string, enum: [login_fail, code_fail, radius_fail]}
        fails: {type: integer}
        banned_until: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    OIDCClient:
      type: object
      description: "Клиентское приложение OIDC (секрет никогда не возвращается)."
      required: [id, client_id, name, redirect_uris, is_public, created_at]
      properties:
        id: {type: string, format: uuid}
        client_id: {type: string, example: mfa_aBcD1234}
        name: {type: string}
        redirect_uris: {type: array, items: {type: string}}
        is_public: {type: boolean, description: "public-клиент: без секрета, PKCE S256 обязателен."}
        created_at: {type: string, format: date-time}
    OIDCClientCreated:
      type: object
      description: "Ответ создания клиента: client_secret показывается единственный раз и только конфиденциальным клиентам."
      required: [id, client_id, name, redirect_uris, is_public, created_at]
      properties:
        id: {type: string, format: uuid}
        client_id: {type: string}
        client_secret: {type: string, description: "Одноразовый: в БД только хеш; повторно не восстанавливается."}
        name: {type: string}
        redirect_uris: {type: array, items: {type: string}}
        is_public: {type: boolean}
        created_at: {type: string, format: date-time}
      example: {id: 019b…, client_id: mfa_aBcD1234, client_secret: "one-time-secret", name: Grafana, redirect_uris: ["https://grafana.example.com/login/generic_oauth"], is_public: false, created_at: "2026-09-05T12:00:00Z"}
    OIDCDiscovery:
      type: object
      description: "Discovery-документ OpenID Connect Provider (issuer — server.domain, иначе схема+Host запроса)."
      required: [issuer, authorization_endpoint, token_endpoint, userinfo_endpoint, jwks_uri, response_types_supported, grant_types_supported, subject_types_supported, id_token_signing_alg_values_supported, code_challenge_methods_supported, scopes_supported, token_endpoint_auth_methods_supported]
      properties:
        issuer: {type: string, format: uri}
        authorization_endpoint: {type: string, format: uri}
        token_endpoint: {type: string, format: uri}
        userinfo_endpoint: {type: string, format: uri}
        jwks_uri: {type: string, format: uri}
        response_types_supported: {type: array, items: {type: string}}
        grant_types_supported: {type: array, items: {type: string}}
        subject_types_supported: {type: array, items: {type: string}}
        id_token_signing_alg_values_supported: {type: array, items: {type: string}}
        code_challenge_methods_supported: {type: array, items: {type: string}}
        scopes_supported: {type: array, items: {type: string}}
        token_endpoint_auth_methods_supported: {type: array, items: {type: string}}
    Error:
      type: object
      required: [error]
      description: "Машинный код ошибки без внутренних деталей."
      properties:
        error:
          type: string
      example: {error: bad_credentials}
    LicenseStatus:
      type: object
      description: "Маскированный статус лицензии (license-блоб не входит). user_limit=0 и unlimited=true — не ограничено (демо/безлимит); free всегда 5."
      required: [mode, user_limit, unlimited, active_users, at_limit, revoked, expired, grace, days_left, trial_days_left]
      properties:
        mode:
          type: string
          enum: [free, trial, licensed]
        user_limit:
          type: integer
        unlimited:
          type: boolean
        active_users:
          type: integer
          description: Активные (не disabled) пользователи.
        at_limit:
          type: boolean
        lic_id:
          type: string
        customer:
          type: string
        plan:
          type: string
          enum: [subscription, perpetual]
        features:
          type: array
          items:
            type: string
        revoked:
          type: boolean
          description: Лицензия отозвана CRL — сервер в free.
        expired:
          type: boolean
          description: Подписка истекла позже grace — сервер в free.
        grace:
          type: boolean
          description: Подписка истекла, действует grace-окно 5 дней.
        days_left:
          type: integer
          description: Дней подписки (0 в grace).
        trial_days_left:
          type: integer
        updates_until:
          type: string
          description: "Окно обновлений (maintenance_expires), YYYY-MM-DD; версии, собранные позже, не стартуют."
      example: {mode: licensed, user_limit: 25, unlimited: false, active_users: 3, at_limit: false, lic_id: 11111111-2222-3333-4444-555555555555, customer: "ООО Ромашка", plan: subscription, revoked: false, expired: false, grace: false, days_left: 360, trial_days_left: 0, updates_until: "2027-09-01"}
    RateLimitError:
      type: object
      required: [error, retry_after]
      properties:
        error:
          type: string
          enum: [rate_limited, cooldown]
        retry_after:
          type: integer
          description: Секунды до повторной попытки (дублируется заголовком Retry-After).
      example: {error: cooldown, retry_after: 30}
    Ok:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
          enum: [true]
      example: {ok: true}
    StartRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
          format: password
    VerifyRequest:
      type: object
      required: [challenge_id, code]
      properties:
        challenge_id:
          type: string
          format: uuid
        code:
          type: string
    CombinedRequest:
      type: object
      required: [username, password, code]
      properties:
        username:
          type: string
        password:
          type: string
          format: password
        code:
          type: string
          description: "Доставленный, TOTP или резервный код."
    PollRequest:
      type: object
      required: [challenge_id]
      properties:
        challenge_id:
          type: string
          format: uuid
    ChallengeIssued:
      type: object
      required: [challenge_id, channel, expires_in]
      properties:
        challenge_id:
          type: string
          format: uuid
        channel:
          type: string
          enum: [email, sms, telegram, telegram_push, totp]
          description: "Канал выдачи кода; totp — челлендж без доставки (код генерируется приложением пользователя)."
        expires_in:
          type: integer
          description: Секунды до истечения челленджа.
    VerifyOK:
      type: object
      required: [ok, username]
      properties:
        ok:
          type: boolean
          enum: [true]
        username:
          type: string
    VerifyFail:
      type: object
      required: [ok, attempts_left]
      properties:
        ok:
          type: boolean
          enum: [false]
        attempts_left:
          type: integer
          description: Остаток попыток челленджа после неверного кода.
    PollStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [pending, approved, denied, expired]
          description: "approved/denied — решение push-кнопок Telegram; expired — просрочен, попытки исчерпаны или код погашен."
    WebauthnBegin:
      type: object
      required: [handle, options]
      properties:
        handle:
          type: string
          description: Одноразовый идентификатор сессии церемонии.
        options:
          type: object
          additionalProperties: true
          description: "PublicKeyCredentialRequestOptions (вход) или PublicKeyCredentialCreationOptions (регистрация) — формат WebAuthn Level 2."
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
          format: password
        remember_device:
          type: boolean
          description: Доверять устройству (cookie twofa_device на срок policy.trusted_device_ttl).
          default: false
    Login2FARequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
          format: password
        code:
          type: string
          description: "Код доставки/TOTP/резервный; пустой — только сразу после успешной WebAuthn-церемонии (webauthn_web_pending)."
        remember_device:
          type: boolean
          default: false
    LoginOK:
      type: object
      required: [ok, username, csrf]
      properties:
        ok:
          type: boolean
          enum: [true]
        username:
          type: string
        csrf:
          type: string
          description: "CSRF-токен сессии — для заголовка X-CSRF-Token мутаций (cookie HttpOnly, скрипт прочитать не может)."
    LoginTwoFactor:
      type: object
      required: [two_factor, methods]
      properties:
        two_factor:
          type: string
          enum: [required]
        methods:
          type: array
          items:
            type: string
            enum: [totp, webauthn, email, sms, telegram]
          description: Доступные пользователю способы второго фактора.
    Profile:
      type: object
      required: [username, role, email, phone, email_set, phone_set, telegram_linked, totp_confirmed, webauthn_count, prefer_channels, csrf, radius_push, radius_reply_set]
      properties:
        username:
          type: string
        role:
          type: string
        email:
          type: string
        phone:
          type: string
        email_set:
          type: boolean
        phone_set:
          type: boolean
        telegram_linked:
          type: boolean
        totp_confirmed:
          type: boolean
        webauthn_count:
          type: integer
        prefer_channels:
          type: array
          items:
            type: string
        csrf:
          type: string
        radius_push:
          type: boolean
        radius_reply_set:
          type: boolean
    PasswordChangeRequest:
      type: object
      required: [old, new]
      properties:
        old:
          type: string
          format: password
        new:
          type: string
          format: password
    ContactsRequest:
      type: object
      required: [code]
      properties:
        email:
          type: string
          nullable: true
          description: nil — не менять; пустая строка — очистить.
        phone:
          type: string
          nullable: true
        code:
          type: string
    PreferRequest:
      type: object
      required: [channels]
      properties:
        channels:
          type: array
          minItems: 1
          items:
            type: string
            enum: [totp, email, sms, telegram, telegram_push]
    CodeRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string
    WebauthnRegisterBeginRequest:
      type: object
      required: [name, code]
      properties:
        name:
          type: string
          description: Метка ключа.
        code:
          type: string
    WebauthnCredential:
      type: object
      required: [id, name, attachment, transports, aaguid, backup_eligible, backup_state, clone_warning, last_used_at]
      properties:
        id:
          type: integer
        name:
          type: string
        attachment:
          type: string
        transports:
          type: array
          items:
            type: string
        aaguid:
          type: string
        backup_eligible:
          type: boolean
        backup_state:
          type: boolean
        clone_warning:
          type: boolean
        last_used_at:
          type: string
          nullable: true
          format: date-time
    Device:
      type: object
      required: [id, ua, ip, created_at, last_seen_at, expires_at]
      properties:
        id:
          type: integer
        ua:
          type: string
          description: User-Agent устройства.
        ip:
          type: string
        created_at:
          type: string
          format: date-time
        last_seen_at:
          type: string
          format: date-time
          nullable: true
        expires_at:
          type: string
          format: date-time
    User:
      type: object
      description: Пользователь в ответах admin API (password_hash никогда не раскрывается).
      required: [id, username, role, enabled, email, phone, telegram_linked, prefer_channels, radius_push]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        role:
          type: string
          description: "user или admin."
        enabled:
          type: boolean
        email:
          type: string
        phone:
          type: string
        telegram_linked:
          type: boolean
        prefer_channels:
          type: array
          items:
            type: string
        radius_push:
          type: boolean
        radius_reply:
          type: object
          additionalProperties:
            type: string
          nullable: true
          description: RADIUS-атрибуты ответа для пользователя.
    UserCreateRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
          format: password
        email:
          type: string
        phone:
          type: string
        role:
          type: string
          default: user
        prefer_channels:
          type: array
          items:
            type: string
            enum: [totp, email, sms, telegram, telegram_push]
    UserPatchRequest:
      type: object
      description: Отсутствующие (nil) поля не меняются.
      properties:
        username:
          type: string
          nullable: true
        password:
          type: string
          nullable: true
          format: password
        email:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        role:
          type: string
          nullable: true
        enabled:
          type: boolean
          nullable: true
        prefer_channels:
          type: array
          nullable: true
          items:
            type: string
            enum: [totp, email, sms, telegram, telegram_push]
        radius_push:
          type: boolean
          nullable: true
        radius_reply:
          type: object
          additionalProperties:
            type: string
    AuditRow:
      type: object
      description: Запись audit_log.
      required: [id, ts, username, event, detail, src_ip, result]
      properties:
        id:
          type: integer
          format: int64
        ts:
          type: string
          format: date-time
        username:
          type: string
          description: Пустая строка — системное событие.
        event:
          type: string
        detail:
          type: object
          additionalProperties: true
          nullable: true
          description: JSONB-детали события.
        src_ip:
          type: string
        result:
          type: string
          enum: [ok, fail]
    Challenge:
      type: object
      description: Метаданные активного челленджа (code_hash не раскрывается).
      required: [id, user_id, channel, purpose, push_state, attempts_left, expires_at, created_at]
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        channel:
          type: string
          enum: [email, sms, telegram, telegram_push, totp, webauthn]
        purpose:
          type: string
          enum: [api, radius, radius_prefetch, ui_confirm, webauthn_session, webauthn_web_pending, tg_link]
        push_state:
          type: string
          enum: ["", pending, approved, denied]
          description: Только для telegram_push; пустая строка для прочих каналов.
        attempts_left:
          type: integer
        expires_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
    SettingsMasked:
      type: object
      description: "Дерево настроек по секциям; секретные значения маскируются форматом {\"set\":bool,\"value\":\"••••\"}. PUT принимает плоские известные ключи, маска/пустая строка = «не менять»."
      additionalProperties: true
      example: {listen: {http: "0.0.0.0:8080", radius_auth: "0.0.0.0:1812", radius_acct: "0.0.0.0:1813"}, admin_token: {set: true, value: "••••"}, radius: {secret: {set: true, value: "••••"}, max_fail_per_user: 5, push_wait: 20s}, smtp: {host: smtp.example.com, port: 587, password: {set: true, value: "••••"}, starttls: true}, telegram: {bot_token: {set: true, value: "••••"}}, totp: {issuer: twofa, digits: 6, period: 30, skew: 1}, webauthn: {rp_id: 2fa.example.com}, policy: {code_ttl: 5m, code_length: 6, max_attempts: 3, resend_cooldown: 30s, session_ttl: 12h}}
    SettingsExport:
      type: object
      description: "Файл экспорта настроек: все ключи с СЫРЫМИ значениями (секреты включены — файл хранить как секрет), master_key/admin_token исключены всегда."
      required: [_warning, exported_at, settings]
      properties:
        _warning:
          type: string
          example: "файл содержит секреты — храните безопасно"
        exported_at:
          type: string
          format: date-time
        settings:
          type: object
          additionalProperties: true
          description: "Карта «известный ключ → значение» (сырой JSON значений)."
      example: {_warning: "файл содержит секреты — храните безопасно", exported_at: "2026-09-05T12:00:00Z", settings: {totp: {issuer: corp-2fa, digits: 6, period: 30, skew: 1}, radius: {secret: "raw-radius-secret", code_lengths: [6, 8]}, smtp: {host: smtp.example.com, port: 587, password: raw-smtp-password}}}
    SettingsImportRequest:
      type: object
      required: [settings]
      properties:
        settings:
          type: object
          additionalProperties: true
          description: "Карта «известный ключ → значение»; null/маски/master_key/admin_token/license.* пропускаются."
      example: {settings: {totp: {issuer: corp-2fa}, "listen.http": ":8080"}}
    SettingsImportResult:
      type: object
      required: [applied, skipped]
      properties:
        applied:
          type: integer
          description: Число применённых ключей.
        skipped:
          type: integer
          description: "Число пропущенных ключей (null, маски, master_key/admin_token, license.*)."
      example: {applied: 12, skipped: 3}
