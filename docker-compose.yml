# twofa + PostgreSQL: экспортируйте пароль БД (без дефолта — осознанно):
#   export TWOFA_PG_PASSWORD='...'   # или .env рядом с compose-файлом
#   docker compose up -d && docker compose logs twofa | grep "ADMIN PASSWORD"
# Пароль первого администратора — в ./admin_password.txt внутри контейнера
# (см. README «Быстрый старт»).
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: twofa
      POSTGRES_PASSWORD: "${TWOFA_PG_PASSWORD:?Ошибка: задайте TWOFA_PG_PASSWORD (пароль БД) перед запуском}"
      POSTGRES_DB: twofa
    volumes:
      - twofa_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U twofa -d twofa"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  twofa:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      TWOFA_DB_DSN: "postgres://twofa:${TWOFA_PG_PASSWORD:?Ошибка: задайте TWOFA_PG_PASSWORD (пароль БД) перед запуском}@db:5432/twofa"
      # TRUSTED_PROXIES: "127.0.0.0/8,::1/128,172.16.0.0/12,10.0.0.0/8,192.168.0.0/16"
      # ACME_DOMAIN: auth.example.com
      # ACME_EMAIL: admin@example.com
      # ACME_STAGING: "false"
    ports:
      - "80:8080"
      - "8080:8080"
      - "1812:1812/udp"
      - "1813:1813/udp"
    restart: unless-stopped

volumes:
  twofa_pgdata:
