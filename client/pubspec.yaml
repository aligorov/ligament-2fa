name: ligament_authenticator
description: "Cross-platform enterprise 2FA client for Windows, iOS, and Android with GPO support, Number Matching, and Security Posture Telemetry."
publish_to: 'none'
version: 1.0.2+9

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  web_socket_channel: ^3.0.2
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.2
  local_auth: ^2.1.8
  window_manager: ^0.3.8
  tray_manager: ^0.2.3
  win32: ^5.15.0
  win32_registry: ^1.1.3
  ffi: ^2.1.2
  flutter_local_notifications: ^17.1.0
  audioplayers: ^6.0.0
  provider: ^6.1.1
  device_info_plus: ^10.1.0
  intl: ^0.19.0
  url_launcher: ^6.2.5
  flutter_webrtc: ^1.6.2+hotfix.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
    - assets/icons/
